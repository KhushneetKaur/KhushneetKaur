<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#FFA500" opacity="0.045"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA500" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFA500" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="900" height="260" fill="#0a0a0a"/>
  <rect width="900" height="260" fill="url(#scan)"/>

  <!-- terminal frame -->
  <rect x="10" y="10" width="880" height="240" rx="12" fill="none" stroke="#FFA500" stroke-width="2"/>
  <rect x="10" y="10" width="880" height="34" rx="12" fill="#141414"/>
  <rect x="10" y="32" width="880" height="12" fill="#141414"/>
  <circle cx="34" cy="27" r="6" fill="#3a2200"/>
  <circle cx="34" cy="27" r="6" fill="none" stroke="#FFA500" stroke-width="1"/>
  <circle cx="54" cy="27" r="6" fill="#3a2200"/>
  <circle cx="54" cy="27" r="6" fill="none" stroke="#FFA500" stroke-width="1"/>
  <circle cx="74" cy="27" r="6" fill="#3a2200"/>
  <circle cx="74" cy="27" r="6" fill="none" stroke="#FFA500" stroke-width="1"/>
  <text x="450" y="32" fill="#FFB000" font-family="Courier New, monospace" font-size="13" text-anchor="middle">khushneet@github:~$ ./boot_profile.sh</text>

  <!-- scan sweep beam -->
  <rect x="10" y="44" width="880" height="30" fill="url(#sweep)">
    <animate attributeName="y" values="44;206;44" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- pixel robot avatar, left side -->
  <g transform="translate(46,92)">
    <rect width="140" height="130" fill="none"/>
    <!-- antenna -->
    <rect x="62" y="0" width="8" height="16" fill="#FFA500"/>
    <circle cx="66" cy="0" r="6" fill="#FFA500">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- head -->
    <rect x="20" y="18" width="100" height="80" rx="10" fill="#141414" stroke="#FFA500" stroke-width="3"/>
    <!-- eyes -->
    <rect x="42" y="48" width="18" height="18" fill="#FFA500">
      <animate attributeName="height" values="18;2;18" keyTimes="0;0.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="48;57;48" keyTimes="0;0.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="48" width="18" height="18" fill="#FFA500">
      <animate attributeName="height" values="18;2;18" keyTimes="0;0.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="48;57;48" keyTimes="0;0.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <!-- mouth -->
    <rect x="45" y="78" width="50" height="6" fill="#FFB000"/>
    <!-- body -->
    <rect x="35" y="102" width="70" height="26" rx="4" fill="#141414" stroke="#FFA500" stroke-width="3"/>
    <circle cx="70" cy="115" r="5" fill="#FFA500">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- typed terminal lines, right side -->
  <g font-family="Courier New, monospace" font-size="20" fill="#FFA500">

    <clipPath id="c1"><rect x="0" y="60" width="0" height="26"><animate attributeName="width" values="0;0;300;300;300;0" keyTimes="0;0.04;0.22;0.85;0.92;1" dur="7s" begin="0.2s" repeatCount="indefinite"/></rect></clipPath>
    <text clip-path="url(#c1)" x="220" y="80">&gt; whoami</text>

    <clipPath id="c2"><rect x="0" y="94" width="0" height="26"><animate attributeName="width" values="0;0;420;420;420;0" keyTimes="0;0.04;0.30;0.85;0.92;1" dur="7s" begin="1.1s" repeatCount="indefinite"/></rect></clipPath>
    <text clip-path="url(#c2)" x="220" y="114" fill="#FFB000">KHUSHNEET_KAUR.exe</text>

    <clipPath id="c3"><rect x="0" y="128" width="0" height="26"><animate attributeName="width" values="0;0;340;340;340;0" keyTimes="0;0.04;0.24;0.85;0.92;1" dur="7s" begin="2.2s" repeatCount="indefinite"/></rect></clipPath>
    <text clip-path="url(#c3)" x="220" y="148">&gt; role --get</text>

    <clipPath id="c4"><rect x="0" y="162" width="0" height="26"><animate attributeName="width" values="0;0;460;460;460;0" keyTimes="0;0.04;0.30;0.85;0.92;1" dur="7s" begin="3.3s" repeatCount="indefinite"/></rect></clipPath>
    <text clip-path="url(#c4)" x="220" y="182" fill="#FFB000">FULL-STACK DEV // CSE FINAL YEAR</text>

    <clipPath id="c5"><rect x="0" y="196" width="0" height="26"><animate attributeName="width" values="0;0;480;480;480;0" keyTimes="0;0.04;0.30;0.85;0.92;1" dur="7s" begin="4.4s" repeatCount="indefinite"/></rect></clipPath>
    <text clip-path="url(#c5)" x="220" y="216" fill="#FFA500">STATUS: OPEN_TO_SDE_ROLES ▮</text>

  </g>

  <!-- cursor blink -->
  <rect x="700" y="200" width="12" height="20" fill="#FFA500">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect width="900" height="260" fill="url(#vignette)"/>
</svg>
